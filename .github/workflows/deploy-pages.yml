name: Deploy PWA to GitHub Pages

# Publishes the static PWA (repo root) to GitHub Pages so it can be opened in any
# browser and installed to a phone's home screen. The live timetable works here
# because a real web host (unlike a sandboxed preview) may call the public
# transport.opendata.ch API.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (PWA files only)
        run: |
          mkdir -p _site
          cp index.html styles.css app.js ticket-render.js sw.js manifest.webmanifest icon.svg _site/
          cp -r vendor _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check the live site serves every offline file
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for f in index.html styles.css app.js ticket-render.js sw.js manifest.webmanifest icon.svg \
                   vendor/pdfjs/pdf.min.js vendor/pdfjs/pdf.worker.min.js vendor/jsqr/jsQR.js; do
            ok=""
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE}${f}")
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "missing on live site: $f (HTTP $code)"; exit 1; }
            echo "ok $f"
          done
