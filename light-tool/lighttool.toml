# Light-Tool-Manifest für SBB Light.
#
# Schema gemäss light-sdk docs/tool_metadata/README.md (gepinnter Stand siehe
# light-tool/ci/light-sdk.ref). Das light-sdk-Plugin erzeugt daraus das
# AndroidManifest.xml, applicationId, namespace, versionCode und versionName;
# ein eigenes AndroidManifest.xml ist nicht erlaubt.
#
# Quelloffen (MIT): https://github.com/brunokuratli/lightTicket

[tool]
id = "com.lightticket.sbb"
label = "SBB Light"
versionCode = 1
versionName = "0.1.0"
# INTERNET: Fahrplandaten von transport.opendata.ch.
# READ_MEDIA_IMAGES: Barcode-Bild eines Tickets aus dem Album übernehmen
# (über lightContext.media; Tickets bleiben auf dem Gerät).
permissions = ["android.permission.INTERNET", "android.permission.READ_MEDIA_IMAGES"]
# tool-manager-provider: Billett-PDF vom Computer im selben WLAN hochladen
# (light-sdk docs/tool_manager), landet in files/shared/billette.
capabilities = ["tool-manager-provider"]
# Für den LightOS-Emulator die folgende Zeile verwenden und mit
# -DlightSdk.allowAltServerPackage=true bauen:
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
